<script>document.getElementById("contactForm").addEventListener("submit",function(e){e.preventDefault();const n=document.getElementById("name").value.trim(),p=document.getElementById("phone").value.trim(),t=document.getElementById("eventType").value.trim();if(n.length<2)return alert("Please enter a valid name.");if(!/^[0-9+ -]{10,15}$/.test(p))return alert("Please enter a valid phone number.");if(!t)return alert("Please enter your event type.");alert("Thank you! Your enquiry has been submitted on this demo website.");this.reset()});</script>
